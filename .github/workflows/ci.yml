name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── API Python ──────────────────────────────────────────────
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt aiosqlite

      - name: Run tests
        run: pytest --tb=short -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_PRO_MONTHLY: price_placeholder
          STRIPE_PRICE_PRO_YEARLY: price_placeholder
          STRIPE_PRICE_STUDIO_MONTHLY: price_placeholder
          STRIPE_PRICE_STUDIO_YEARLY: price_placeholder
          AWS_ACCESS_KEY_ID: placeholder
          AWS_SECRET_ACCESS_KEY: placeholder
          AWS_BUCKET_NAME: placeholder
          AI_WORKER_URL: http://localhost:8001
          JWT_SECRET: test-secret-for-ci

  # ── Web Next.js ──────────────────────────────────────────────
  web-typecheck:
    name: Web type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Type-check
        run: yarn type-check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Mobile React Native ──────────────────────────────────────
  mobile-typecheck:
    name: Mobile type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Type-check
        run: yarn type-check
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: placeholder
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: placeholder
