name: Mobile build (EAS)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options: [all, ios, android]
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options: [development, preview, production]

jobs:
  build:
    name: EAS Build (${{ inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (all platforms)
        if: ${{ inputs.platform == 'all' || inputs.platform == '' }}
        run: eas build --platform all --profile ${{ inputs.profile || 'preview' }} --non-interactive
        working-directory: apps/mobile

      - name: Build (single platform)
        if: ${{ inputs.platform != 'all' && inputs.platform != '' }}
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
        working-directory: apps/mobile
