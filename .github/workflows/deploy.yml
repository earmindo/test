name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Web → Vercel ─────────────────────────────────────────────
  deploy-web:
    name: Deploy web to Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

  # ── API → Railway ─────────────────────────────────────────────
  deploy-api:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API
        run: railway up --service api --detach
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── AI Worker → Railway ───────────────────────────────────────
  deploy-worker:
    name: Deploy AI worker to Railway
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-api   # worker démarre après l'API

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy worker
        run: railway up --service ai-worker --detach
        working-directory: services/ai-worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── Notify ────────────────────────────────────────────────────
  notify:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [deploy-web, deploy-api, deploy-worker]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Deployment summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Vercel) | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API (Railway) | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker (Railway) | ${{ needs.deploy-worker.result }} |" >> $GITHUB_STEP_SUMMARY
