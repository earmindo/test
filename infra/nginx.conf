events { worker_connections 1024; }

http {
  # Compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # Rate limiting global
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

  # Redirection HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Site web (Next.js)
  server {
    listen 443 ssl;
    server_name musicai.app www.musicai.app;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # API
  server {
    listen 443 ssl;
    server_name api.musicai.app;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Rate limiting sur toutes les routes API
    limit_req zone=api burst=20 nodelay;

    location / {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Timeouts généreux pour la génération IA
      proxy_read_timeout 300s;
      proxy_connect_timeout 10s;
    }

    # Webhook Stripe et RevenueCat : body plus grand autorisé
    location ~ ^/api/v1/(subscriptions/webhook|revenuecat/webhook) {
      proxy_pass http://api:8000;
      client_max_body_size 1m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
